<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="NOVA">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
</head>
<body>
    <header class="container-fluid py-3 border-bottom">
        <div class="container">

            <div class="row align-items-center">

                <!-- LOGO (derecha en móvil, izquierda en escritorio) -->
                <div class="col-6 d-flex justify-content-end justify-content-md-start align-items-center order-2 order-md-1">
                    <a href="../index.html" class="d-flex align-items-center text-decoration-none text-dark">
                        <img src="../assets/imagenes/icono/nova.jpeg" alt="Cafeteria NOVA" class="me-2" style="height:50px;">
                        <span class="fs-3 fw-bold text-dark">NOVA</span>
                    </a>
                </div>

                <!-- NAV (hamburguesa izquierda en móvil, menú derecha en escritorio) -->
                <div class="col-6 d-flex justify-content-start justify-content-md-end align-items-center order-1 order-md-2">

                    <!-- Botón hamburguesa -->
                    <button id="menu-btn" class="menu-btn d-md-none">
                        <span class="hamburger"></span>
                    </button>

                    <!-- Menú normal en escritorio -->
                    <ul class="barNav-links d-none d-md-flex list-unstyled mb-0 ms-md-4">
                        <li class="my-2 my-md-0">
                            <a href="../index.html" class="text-decoration-none text-center d-block d-md-inline text-dark">Inicio</a>
                        </li>
                        <li class="my-2 my-md-0">
                            <a href="../views/galeria.html" class="text-decoration-none text-center d-block d-md-inline text-dark">Galería</a>
                        </li>
                        <li class="my-2 my-md-0">
                            <a href="#" class="text-decoration-none fw-bold text-center d-block d-md-inline text-dark">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Imagen superior (solo escritorio) -->
        <div class="d-none d-md-flex justify-content-center mb-4">
            <img src="../assets/imagenes/cards/card3.jpg" 
                class="img-fluid rounded shadow-sm" 
                style="max-width: 500px;" 
                alt="Taza de café verde" width="5488" height="3659">
        </div>

        <div class="container my-5">

                <h1 class="text-center fw-bold mb-4">Contacto</h1>
                <p class="text-center mb-5">Si deseas ponerte en contacto con nosotros, rellena el siguiente formulario.</p>

                <div class="row g-5">
                    <!-- FORMULARIO -->
                    <div class="col-12 col-lg-6">
                        <h2 class="fw-bold mb-3 text-center">Rellenar formulario</h2>

                        <form id="form-contacto" class="p-4 border rounded bg-light">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" name="nombre" required
                                    pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]{3,40}">
                            </div>

                            <!-- Apellidos -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Apellidos</label>
                                <input type="text" class="form-control" name="apellidos" required
                                    pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]{4,60}">
                            </div>

                            <!-- Correo -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo electrónico</label>
                                <input type="email" class="form-control" name="correo" required
                                    pattern="^[^@]+@[^@]+\.[a-zA-Z]{2,}$">
                            </div>

                            <!-- Teléfono -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Teléfono</label>
                                <input type="tel" class="form-control" name="telefono" required
                                    pattern="[0-9]{9}">
                            </div>

                            <!-- Comentarios -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Comentarios</label>
                                <textarea class="form-control" name="comentarios" rows="4"></textarea>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-primary fw-bold">Enviar</button>
                                <button type="reset" class="btn btn-secondary fw-bold">Limpiar</button>
                            </div>

                        </form>

                    </div>

                    <!-- MAPA -->
                    <div class="col-12 col-lg-6">

                        <h3 class="fw-bold mb-3">Ubicación</h3>

                        <div id="map" style="height: 400px; border-radius: 10px;"></div>

                    </div>
                </div>
        </div>
    </main>
    <footer class="bg-light py-4 mt-5">
        <div class="container">

            <div class="row"> <!-- IMPORTANTE: sin justify-content-between -->

                <!-- Columna izquierda -->
                <div class="col-md-6 mb-8 mb-md-0">
                    <p class="fw-bold">Síguenos en nuestras redes:</p>

                    <a href="#" class="me-2"><img src="../assets/imagenes/inconos-rrss/facebook-svgrepo-com.svg" width="28" alt="icono Facebook"></a>
                    <a href="#" class="me-2"><img src="../assets/imagenes/inconos-rrss/twitter-svgrepo-com.svg" width="28" alt="icono Twitter"></a>
                    <a href="#"><img src="../assets/imagenes/inconos-rrss/instagram-svgrepo-com.svg" width="28" alt="icono Instagram"></a>

                    <p class="mt-3">Dirección: Polígono Industrial Tebongo, Cangas del Narcea, Asturias</p>
                    <p><a href="aviso-legal.html" class="fw-bold text-decoration-none text-dark">Aviso legal</a></p>
                </div>

                <!-- Columna derecha (MOVIDA SOLO ELLA) -->
                <div class="col-md-4 offset-md-2 text-md-left text-left">
                    <a href="../index.html" class="d-block mb-2 fw-bold text-decoration-none text-dark">Inicio</a>
                    <a href="views/galeria.html" class="d-block mb-2 fw-bold text-decoration-none text-dark">Galería</a>
                    <a href="#" class="d-block fw-bold text-decoration-none text-dark">Contacto</a>
                </div>

            </div>

        </div>
    </footer>
    <script src="../js/hamburguesa.js"></script>
    <script src="../js/mapa.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>    
</html>
